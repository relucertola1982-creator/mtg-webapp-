name: MTG Price Tracker

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:  # permette di lanciarlo manualmente

permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run price tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mtg_price_tracker.py

      - name: Commit updated prices
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add prezzi_riferimento.json storico_prezzi.json
          git diff --staged --quiet || git commit -m "Update prezzi e storico"
          git push
