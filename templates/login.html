{% extends "base.html" %}
{% block title %}Accedi — MTG Price Tracker{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding:2rem;">
  <div class="glass" style="width:100%; max-width:420px; padding:3rem 2.5rem; text-align:center;">

    <div style="margin-bottom:2.4rem;">
      <div style="font-size:3.5rem; line-height:1; margin-bottom:0.7rem;
                  filter: drop-shadow(0 0 22px rgba(200,155,60,0.5));">⚔️</div>
      <h1 style="font-family:'Cinzel',serif; font-size:1.55rem; font-weight:700;
                 color:var(--gold); text-shadow:0 0 24px rgba(200,155,60,0.38);
                 letter-spacing:0.04em;">MTG Price Tracker</h1>
      <p style="color:rgba(200,200,220,0.42); font-size:0.875rem; margin-top:0.45rem;"
         data-i18n="login-subtitle">Accedi alla tua collezione</p>
    </div>

    {% if error %}
    <div style="background:rgba(248,113,113,0.09); border:1px solid rgba(248,113,113,0.28);
                border-radius:10px; padding:0.75rem 1rem; margin-bottom:1.5rem;
                color:#f87171; font-size:0.875rem;">
      ⚠️ {{ error }}
    </div>
    {% endif %}

    <!-- Language toggle (visible on login too) -->
    <div style="display:flex; justify-content:center; gap:0.5rem; margin-bottom:1.8rem;">
      <button id="btn-it" class="lang-btn" onclick="setLang('it')" title="Italiano">🇮🇹</button>
      <button id="btn-en" class="lang-btn" onclick="setLang('en')" title="English">🇬🇧</button>
    </div>

    <form method="post" action="/login">
      <div style="margin-bottom:1.1rem; text-align:left;">
        <label style="display:block; font-size:0.68rem; font-weight:700;
                      color:rgba(200,200,220,0.42); text-transform:uppercase;
                      letter-spacing:0.14em; margin-bottom:0.45rem;">Username</label>
        <input type="text" name="username" required autofocus
               class="inp" style="width:100%;" placeholder="il tuo username">
      </div>

      <div style="margin-bottom:2rem; text-align:left;">
        <label style="display:block; font-size:0.68rem; font-weight:700;
                      color:rgba(200,200,220,0.42); text-transform:uppercase;
                      letter-spacing:0.14em; margin-bottom:0.45rem;">Password</label>
        <input type="password" name="password" required
               class="inp" style="width:100%;" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-gold" style="width:100%; padding:0.9rem; font-size:1rem;"
              data-i18n="login-btn">
        Accedi →
      </button>
    </form>

    <p style="margin-top:2rem; font-size:0.72rem; color:rgba(200,200,220,0.2);">
      Ale823 · MTG Collection Manager
    </p>
  </div>
</div>
{% endblock %}
