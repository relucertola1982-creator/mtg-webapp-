<!DOCTYPE html>
<html lang="it" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MTG Price Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:       #c89b3c;
      --gold-light: #e8c469;
      --gold-dim:   rgba(200,155,60,0.22);
      --bg:         #050511;
      --glass:      rgba(10,10,26,0.86);
      --radius:     14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #e2e2f0;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Dot-grid background ───────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(rgba(200,155,60,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* ── P9 Background ─────────────────────────────────────────── */
    #p9-bg {
      position: fixed; inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      opacity: 0.10;
      pointer-events: none;
      filter: blur(4px) saturate(0.5);
      transform: scale(1.08);
    }
    .p9-card {
      background-size: cover;
      background-position: center top;
    }
    #p9-overlay {
      position: fixed; inset: 0; z-index: 2;
      background:
        radial-gradient(ellipse 80% 45% at 50% 0%, rgba(200,155,60,0.05) 0%, transparent 65%),
        radial-gradient(ellipse at 50% 60%, rgba(5,5,17,0.55) 0%, rgba(5,5,17,0.98) 100%);
      pointer-events: none;
    }

    /* ── Nav ───────────────────────────────────────────────────── */
    nav {
      position: relative; z-index: 30;
      background: rgba(5,5,17,0.96);
      border-bottom: 1px solid rgba(200,155,60,0.14);
      backdrop-filter: blur(32px);
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem; font-weight: 700;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.06em;
      text-shadow: 0 0 28px rgba(200,155,60,0.4);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .nav-logo span { color: rgba(225,225,240,0.9); }
    .nav-links { display: flex; align-items: center; gap: 0.15rem; }
    .nav-links a {
      color: rgba(200,200,220,0.62);
      text-decoration: none;
      font-size: 0.875rem; font-weight: 500;
      padding: 0.45rem 1rem;
      border-radius: 9px;
      transition: background 0.18s, color 0.18s;
      white-space: nowrap;
    }
    .nav-links a:hover { background: rgba(200,155,60,0.09); color: var(--gold-light); }
    .nav-badge {
      background: var(--gold-dim);
      color: var(--gold-light);
      font-size: 0.64rem; font-weight: 700;
      padding: 0.12rem 0.45rem; border-radius: 20px;
      margin-left: 0.35rem; vertical-align: middle;
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .nav-sep {
      width: 1px; height: 20px;
      background: rgba(200,155,60,0.14);
      margin: 0 0.5rem;
    }
    /* Language pair wrapper */
    .lang-pair { display: flex; align-items: center; gap: 0.15rem; }

    /* Language buttons */
    .lang-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      padding: 0.3rem 0.55rem;
      font-size: 1.1rem;
      line-height: 1;
      transition: all 0.18s;
      opacity: 0.45;
    }
    .lang-btn:hover { opacity: 0.85; border-color: rgba(200,155,60,0.25); }
    .lang-btn.active {
      opacity: 1;
      border-color: rgba(200,155,60,0.4);
      background: rgba(200,155,60,0.08);
    }

    /* ── Layout ────────────────────────────────────────────────── */
    main {
      position: relative; z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.2rem 1.5rem 5rem;
    }

    /* ── Glass card ────────────────────────────────────────────── */
    .glass {
      background: var(--glass);
      border: 1px solid rgba(200,155,60,0.14);
      border-radius: var(--radius);
      backdrop-filter: blur(24px);
      box-shadow: 0 8px 48px rgba(0,0,0,0.55),
                  inset 0 1px 0 rgba(200,155,60,0.06);
    }

    /* ── Stat card ─────────────────────────────────────────────── */
    .stat-card {
      background: linear-gradient(145deg, rgba(200,155,60,0.07), rgba(10,10,26,0.9));
      border: 1px solid rgba(200,155,60,0.2);
      border-radius: var(--radius);
      padding: 1.5rem 1.2rem;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .stat-card:hover { border-color: rgba(200,155,60,0.38); transform: translateY(-2px); }
    .stat-val {
      font-family: 'Cinzel', serif;
      font-size: 2rem; font-weight: 700;
      color: var(--gold);
      line-height: 1.05;
    }
    .stat-lbl {
      font-size: 0.68rem; font-weight: 700;
      color: rgba(200,200,220,0.42);
      text-transform: uppercase; letter-spacing: 0.14em;
      margin-top: 0.45rem;
    }

    /* ── Page header ───────────────────────────────────────────── */
    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem; font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(200,155,60,0.2);
      line-height: 1.2;
    }
    .page-sub {
      color: rgba(200,200,220,0.4);
      font-size: 0.875rem; margin-top: 0.4rem;
    }

    /* ── Table ─────────────────────────────────────────────────── */
    .mtg-table { width: 100%; border-collapse: collapse; }
    .mtg-table th {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: rgba(200,155,60,0.8);
      padding: 1rem 1.2rem;
      text-align: left;
      border-bottom: 1px solid rgba(200,155,60,0.14);
      background: rgba(0,0,0,0.18);
      white-space: nowrap;
    }
    .mtg-table td {
      padding: 0.85rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.034);
      font-size: 0.875rem;
      color: rgba(225,225,240,0.88);
      vertical-align: middle;
    }
    .mtg-table tbody tr { transition: background 0.15s; }
    .mtg-table tbody tr:hover td { background: rgba(200,155,60,0.04); }
    .mtg-table tbody tr:last-child td { border-bottom: none; }

    /* ── Badges ────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 0.18rem 0.6rem; border-radius: 20px;
      font-size: 0.7rem; font-weight: 600; white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .badge-foil {
      background: linear-gradient(135deg, rgba(200,155,60,0.2), rgba(232,196,105,0.1));
      border: 1px solid rgba(200,155,60,0.42);
      color: var(--gold-light);
    }
    .badge-normal {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(200,200,220,0.6);
    }
    .badge-admin {
      background: rgba(200,155,60,0.14);
      border: 1px solid rgba(200,155,60,0.38);
      color: var(--gold);
    }

    /* ── Inputs ────────────────────────────────────────────────── */
    .inp {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(200,155,60,0.17);
      border-radius: 10px; padding: 0.65rem 1rem;
      color: #e8e8f4; font-size: 0.9rem; font-family: 'Space Grotesk', sans-serif;
      outline: none; transition: border-color 0.2s, background 0.2s;
    }
    .inp:focus { border-color: rgba(200,155,60,0.48); background: rgba(255,255,255,0.06); }
    .inp::placeholder { color: rgba(200,200,220,0.22); }

    /* ── Buttons ───────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.45rem;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.875rem; font-weight: 600;
      padding: 0.65rem 1.5rem; border-radius: 10px;
      border: none; cursor: pointer;
      transition: opacity 0.18s, transform 0.12s, box-shadow 0.18s;
      letter-spacing: 0.01em;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-gold {
      background: linear-gradient(135deg, #d4a83e, #9a6e20);
      color: #160d01;
      box-shadow: 0 4px 20px rgba(200,155,60,0.22);
    }
    .btn-gold:hover { box-shadow: 0 6px 28px rgba(200,155,60,0.36); }
    .btn-danger {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.28);
      color: #f87171;
    }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(200,200,220,0.7);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); }

    /* ── Misc ──────────────────────────────────────────────────── */
    .card-link {
      color: rgba(225,225,240,0.88);
      text-decoration: none; font-weight: 500;
      transition: color 0.18s;
    }
    .card-link:hover { color: var(--gold-light); }

    .divider { border: none; border-top: 1px solid rgba(200,155,60,0.12); margin: 1.5rem 0; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
    ::-webkit-scrollbar-thumb { background: rgba(200,155,60,0.24); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(200,155,60,0.44); }

    select option { background: #0e0e22; color: #e2e2f0; }

    /* ── Responsive layouts ────────────────────────────────────── */
    .card-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .add-layout {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 1.5rem;
      align-items: start;
    }
    .stats-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    /* ── Hamburger ─────────────────────────────────────────────── */
    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      z-index: 40;
    }
    .hamburger span {
      display: block;
      width: 22px; height: 2px;
      background: rgba(200,155,60,0.85);
      border-radius: 2px;
      transition: all 0.22s;
    }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.open span:nth-child(2) { opacity: 0; width: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    /* ── Mobile ────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      main { padding: 1.2rem 1rem 3rem; }
      nav  { padding: 0 1rem; }
      .page-title { font-size: 1.5rem; }

      /* Hamburger visible, links hidden by default */
      .hamburger { display: flex; }
      #nav-links {
        display: none;
        position: fixed;
        top: 64px; left: 0; right: 0;
        background: rgba(5,5,17,0.98);
        border-bottom: 1px solid rgba(200,155,60,0.14);
        flex-direction: column;
        padding: 0.6rem 0.75rem 1rem;
        gap: 0.15rem;
        z-index: 25;
        backdrop-filter: blur(32px);
      }
      #nav-links.open { display: flex; }
      #nav-links a {
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        border-radius: 9px;
      }
      #nav-links .nav-sep { display: none; }
      #nav-links .lang-pair {
        padding: 0.4rem 0.5rem;
        gap: 0.5rem;
      }
      .lang-btn { padding: 0.4rem 0.75rem; font-size: 1.1rem; }

      /* Card detail: stack vertically */
      .card-layout {
        grid-template-columns: 1fr;
      }
      .card-layout .card-img-col {
        max-width: 240px;
        margin: 0 auto;
      }

      /* Add card: stack with preview on top */
      .add-layout {
        grid-template-columns: 1fr;
      }
      .add-layout .add-preview-col {
        order: -1;
        max-width: 180px;
        margin: 0 auto;
      }

      /* Stats 3-col → 1 col on very small, 2 col otherwise */
      .stats-3 { grid-template-columns: repeat(2, 1fr); }

      /* Table: hide less important columns */
      .hide-mobile { display: none; }

      /* Bigger tap targets */
      .btn { padding: 0.7rem 1.2rem; }
      .mtg-table td, .mtg-table th { padding: 0.7rem 0.75rem; }
    }

    @media (max-width: 400px) {
      .stats-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="p9-bg"></div>
<div id="p9-overlay"></div>

{% if user %}
<nav>
  <a href="/" class="nav-logo">⚔️ MTG <span>Price Tracker</span></a>

  <div class="nav-links" id="nav-links">
    <a href="/"         data-i18n="nav-collection" onclick="closeNav()">🃏 Collezione</a>
    <a href="/add-card" data-i18n="nav-add"        onclick="closeNav()">➕ Aggiungi</a>
    <a href="/sold"     data-i18n="nav-sold"        onclick="closeNav()">💰 Vendute</a>
    {% if user.is_admin %}
    <a href="/admin" onclick="closeNav()">⚙️ Admin <span class="nav-badge">Admin</span></a>
    {% endif %}
    <div class="nav-sep"></div>
    <div class="lang-pair">
      <button id="btn-it" class="lang-btn" onclick="setLang('it')" title="Italiano">🇮🇹</button>
      <button id="btn-en" class="lang-btn" onclick="setLang('en')" title="English">🇬🇧</button>
    </div>
    <div class="nav-sep"></div>
    <a href="/logout" data-i18n="nav-logout" onclick="closeNav()">🚪 Esci</a>
  </div>

  <button class="hamburger" id="hamburger" onclick="toggleNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<script>
// ── P9 Background ──────────────────────────────────────────────
(async function loadP9() {
  const names = ["Black Lotus","Ancestral Recall","Time Walk","Timetwister",
                 "Mox Pearl","Mox Sapphire","Mox Jet","Mox Ruby","Mox Emerald"];
  const bg = document.getElementById('p9-bg');
  try {
    const r = await fetch('https://api.scryfall.com/cards/collection', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ identifiers: names.map(n => ({ name:n, set:'lea' })) })
    });
    const { data } = await r.json();
    for (const card of (data || [])) {
      const url = card.image_uris?.normal || card.card_faces?.[0]?.image_uris?.normal;
      if (url) {
        const d = document.createElement('div');
        d.className = 'p9-card';
        d.style.backgroundImage = `url(${url})`;
        bg.appendChild(d);
      }
    }
  } catch (_) {}
})();

// ── i18n ───────────────────────────────────────────────────────
const I18N = {
  it: {
    'nav-collection':'🃏 Collezione','nav-add':'➕ Aggiungi','nav-sold':'💰 Vendute','nav-logout':'🚪 Esci',
    'dash-title':'La tua Collezione','dash-refresh':'🔄 Aggiorna prezzi',
    'stat-total-value':'Valore Totale','stat-cards':'Carte Monitorate','stat-foil':'Di cui Foil','stat-top':'Carta più Preziosa',
    'th-card':'Carta','th-set':'Set · #','th-version':'Versione','th-lang':'Lingua',
    'th-price':'Prezzo','th-updated':'Aggiornato','th-last-price':'Ultimo Prezzo','th-sold-on':'Venduta il',
    'sold-title':'Carte Vendute','sold-subtitle':'Storico delle carte rimosse dalla collezione',
    'sold-empty':'Nessuna carta venduta ancora.',
    'sold-empty-sub':'Le carte che rimuovi dalla collezione appariranno qui.',
    'add-title':'Aggiungi Carta',
    'add-subtitle':'Cerca la carta su Scryfall, scegli la versione e salvala nella tua collezione',
    'add-search-label':'Cerca Carta','add-set-label':'Edizione / Set',
    'add-finish-label':'Finitura','add-lang-label':'Lingua','add-fx-label':'Versione Speciale',
    'add-price-label':'Prezzo Acquisto (€)','add-qty-label':'Quantità',
    'add-btn':'➕ Aggiungi alla Collezione',
    'card-back':'← Torna alla collezione','card-details':'Dettagli',
    'card-set':'Set','card-set-name':'Nome Set','card-type':'Tipo','card-updated':'Ultima modifica',
    'card-current':'Prezzo Attuale','card-min':'Minimo Storico','card-max':'Massimo Storico',
    'card-history':'Storico Prezzi','card-readings':'rilevamenti',
    'card-no-data':'Dati insufficienti per il grafico.',
    'card-no-data-sub':'Il grafico si popolerà dopo più rilevamenti orari.',
    'admin-title':'Pannello Admin','admin-subtitle':"Gestisci gli utenti che possono accedere all'app",
    'admin-add-user':'➕ Aggiungi Utente','admin-users':'Utenti Registrati',
    'admin-role':'Ruolo','admin-registered':'Registrato','admin-actions':'Azioni',
    'admin-delete':'Elimina','admin-user-role':'Utente',
    'login-subtitle':'Accedi alla tua collezione','login-btn':'Accedi →',
  },
  en: {
    'nav-collection':'🃏 Collection','nav-add':'➕ Add Card','nav-sold':'💰 Sold','nav-logout':'🚪 Logout',
    'dash-title':'Your Collection','dash-refresh':'🔄 Refresh Prices',
    'stat-total-value':'Total Value','stat-cards':'Tracked Cards','stat-foil':'Foil Cards','stat-top':'Most Valuable',
    'th-card':'Card','th-set':'Set · #','th-version':'Version','th-lang':'Language',
    'th-price':'Price','th-updated':'Updated','th-last-price':'Last Price','th-sold-on':'Sold On',
    'sold-title':'Sold Cards','sold-subtitle':'History of cards removed from collection',
    'sold-empty':'No cards sold yet.',
    'sold-empty-sub':'Cards you remove from your collection will appear here.',
    'add-title':'Add Card',
    'add-subtitle':'Search for a card on Scryfall, choose the version and save it to your collection',
    'add-search-label':'Search Card','add-set-label':'Edition / Set',
    'add-finish-label':'Finish','add-lang-label':'Language','add-fx-label':'Special Version',
    'add-price-label':'Purchase Price (€)','add-qty-label':'Quantity',
    'add-btn':'➕ Add to Collection',
    'card-back':'← Back to collection','card-details':'Details',
    'card-set':'Set','card-set-name':'Set Name','card-type':'Type','card-updated':'Last updated',
    'card-current':'Current Price','card-min':'Historical Low','card-max':'Historical High',
    'card-history':'Price History','card-readings':'readings',
    'card-no-data':'Not enough data for the chart.',
    'card-no-data-sub':'The chart will populate after more hourly readings.',
    'admin-title':'Admin Panel','admin-subtitle':'Manage users who can access the app',
    'admin-add-user':'➕ Add User','admin-users':'Registered Users',
    'admin-role':'Role','admin-registered':'Registered','admin-actions':'Actions',
    'admin-delete':'Delete','admin-user-role':'User',
    'login-subtitle':'Sign in to your collection','login-btn':'Sign In →',
  }
};

let _lang = localStorage.getItem('mtg-lang') || 'it';

function applyI18n(lang) {
  const d = I18N[lang] || I18N.it;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.dataset.i18n]; if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = d[el.dataset.i18nPh]; if (v !== undefined) el.placeholder = v;
  });
  document.getElementById('html-root').lang = lang;
  document.getElementById('btn-it')?.classList.toggle('active', lang === 'it');
  document.getElementById('btn-en')?.classList.toggle('active', lang === 'en');
}

function setLang(lang) {
  _lang = lang;
  localStorage.setItem('mtg-lang', lang);
  applyI18n(lang);
}

document.addEventListener('DOMContentLoaded', () => applyI18n(_lang));

// ── Hamburger ──────────────────────────────────────────────────
function toggleNav() {
  const nav = document.getElementById('nav-links');
  const btn = document.getElementById('hamburger');
  nav.classList.toggle('open');
  btn.classList.toggle('open');
}
function closeNav() {
  document.getElementById('nav-links')?.classList.remove('open');
  document.getElementById('hamburger')?.classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('nav')) closeNav();
});
</script>

{% block scripts %}{% endblock %}
</body>
</html>
